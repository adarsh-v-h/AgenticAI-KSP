name: Deploy backend + smoke test (auto-revert on failure)

# Deploys the BACKEND (AppSail) to Catalyst on push to main.
#
# The FRONTEND is NOT auto-deployed here. It is served from Catalyst Web Client
# Hosting (Slate was abandoned earlier because its *.onslate.in origin can't get
# a CORS header from the AppSail proxy). After a frontend change you must rebuild
# and republish the web client manually — see DEPLOYMENT.md ("Web Client
# Hosting") for the client-package/ steps.
#
# Pipeline:
#   1. Test gate  — backend pytest + frontend vitest must pass.
#   2. Deploy     — AppSail via Catalyst CLI (token auth).
#   3. Smoke test — scripts/smoke_test.py against the live backend URL.
#   4. Promote    — tag last-good-deploy on success.
#      Revert     — check out last-good-deploy tag and redeploy on failure.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   CATALYST_TOKEN  — from `catalyst token:generate` (never expires until revoked)
#   ENV_FILE        — full contents of the backend .env

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: catalyst-deploy
  cancel-in-progress: false

env:
  BACKEND_URL: https://crime-intel-backend-50043099694.development.catalystappsail.in

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest backend/tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests + build verification
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_API_BASE_URL=${{ env.BACKEND_URL }} npm run build

  deploy-backend:
    name: Deploy backend + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for revert)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Restore .env from secret
        run: printf '%s' "${{ secrets.ENV_FILE }}" > .env

      - name: Generate app-config.json + bundle deps + deploy
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          python3 scripts/gen_app_config.py
          python3 -m pip install -r backend/requirements.txt -t backend/ --upgrade --quiet
          catalyst deploy --only appsail --ignore-scripts --token "$CATALYST_TOKEN"

      - name: Wait for AppSail to come up
        run: sleep 45

      - name: Smoke test live deployment
        id: smoke
        continue-on-error: true
        run: python3 scripts/smoke_test.py --base "$BACKEND_URL"

      - name: Tag last-good-deploy on success
        if: steps.smoke.outcome == 'success'
        run: |
          git tag -f last-good-deploy
          git push -f origin last-good-deploy

      - name: Auto-revert to last-good-deploy on failure
        if: steps.smoke.outcome == 'failure'
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          echo "::error::Smoke test failed — rolling back to last-good-deploy."
          if git rev-parse last-good-deploy >/dev/null 2>&1; then
            git checkout last-good-deploy -- backend/ scripts/ requirements.txt .env 2>/dev/null || true
            python3 scripts/gen_app_config.py
            python3 -m pip install -r backend/requirements.txt -t backend/ --upgrade --quiet
            catalyst deploy --only appsail --ignore-scripts --token "$CATALYST_TOKEN"
            echo "Rolled back successfully."
          else
            echo "::warning::No last-good-deploy tag yet — cannot auto-revert."
          fi

      - name: Fail run if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
