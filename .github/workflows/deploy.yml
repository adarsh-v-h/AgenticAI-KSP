name: Deploy backend + frontend + smoke test (auto-revert on failure)

# Deploys BOTH components to Catalyst on push to main:
#   - Backend  → AppSail            (catalyst deploy --only appsail)
#   - Frontend → Web Client Hosting (catalyst deploy --only client)
#
# The frontend is served from Catalyst Web Client Hosting (Slate was abandoned
# earlier because its *.onslate.in origin can't get a CORS header from the
# AppSail proxy). Both deploys go through the Catalyst CLI with the same token.
#
# Pipeline:
#   1. Test gate  — backend pytest + frontend vitest must pass.
#   2. Deploy     — AppSail + Web Client via Catalyst CLI (token auth).
#   3. Smoke test — scripts/smoke_test.py against the live backend URL.
#   4. Promote    — tag last-good-deploy on success.
#      Revert     — check out last-good-deploy tag and redeploy on failure.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   CATALYST_CLI_TOKEN  — from `catalyst token:generate`. This is the CLI DEPLOY
#                         token (long-lived until revoked). It is NOT the runtime
#                         OAuth access token the backend uses to call Catalyst
#                         APIs — that one is auto-refreshed in-app from the
#                         refresh credentials in .env (see catalyst_token.py).
#   ENV_FILE            — full contents of the backend .env

on:
  push:
    branches: [main]
    # Skip the whole run when every changed file is doc-only. GitHub only
    # skips if ALL changed files match these patterns — a push that touches
    # e.g. backend/ AND Docs.md still runs normally.
    paths-ignore:
      - "Support Documents/**"
      - "Cleanup And Imp/**"
      - "**/*.md"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: catalyst-deploy
  cancel-in-progress: false

# The deploy job pushes the `last-good-deploy` git tag on success, which needs
# write access to the repo contents. The default GITHUB_TOKEN is read-only
# unless we request it here.
permissions:
  contents: write

env:
  BACKEND_URL: https://crime-intel-backend-50043099694.development.catalystappsail.in

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Backend tests
        run: python -m pytest backend/tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests + build verification
        working-directory: frontend
        run: |
          npm ci
          npm test
          VITE_API_BASE_URL=${{ env.BACKEND_URL }} npm run build

  deploy:
    name: Deploy backend + frontend + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for revert)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Catalyst CLI
        # Pinned to the version verified working for this project's deploys
        # Added retry loop to make deployment pipeline resilient to transient registry.npmjs.org 503 errors.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 10000
          for i in {1..3}; do
            npm install -g zcatalyst-cli@1.27.0 && exit 0
            echo "Installation failed, retrying in 5 seconds..."
            sleep 5
          done
          exit 1

      - name: Restore .env from secret
        run: printf '%s' "${{ secrets.ENV_FILE }}" > .env

      - name: Build frontend into client-package/
        run: |
          cd frontend
          npm ci
          VITE_API_BASE_URL="$BACKEND_URL" npm run build
          cd ..
          # Refresh client-package/ contents, keeping its client-package.json.
          find client-package -mindepth 1 ! -name 'client-package.json' -delete
          cp -r frontend/dist/. client-package/

      - name: Generate app-config.json + bundle deps + deploy (backend + client)
        env:
          CATALYST_CLI_TOKEN: ${{ secrets.CATALYST_CLI_TOKEN }}
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
          CATALYST_ORG_ID: ${{ secrets.CATALYST_ORG_ID }}
        run: |
          python3 scripts/gen_app_config.py
          python3 -m pip install -r backend/requirements.txt -t backend/ --upgrade --quiet
          # -p/--project and --org are REQUIRED here: this runner has no
          # .catalystrc (it's gitignored, project-local only), so without
          # these flags the CLI has no project/org context and fails with
          # "Org and Project Id cannot be empty".
          #
          # IMPORTANT: the Catalyst CLI has been observed to print that error
          # and STILL exit 0 — `set -e` alone will NOT catch this, so we
          # capture output and explicitly grep for known failure text before
          # letting the pipeline proceed to the smoke test. Without this, the
          # smoke test just re-validates the OLD still-running deployment and
          # the whole pipeline "passes" while shipping nothing (this is
          # exactly what happened on 2026-07-19 — see git history).
          # --dc in is REQUIRED in CI: this project lives in Zoho's India
          # datacenter (CATALYST_BASE_URL=api.catalyst.zoho.in). A local CLI
          # works without it because it has stored login state pinned to the
          # IN DC, but a fresh CI install with token-only auth defaults to a
          # different DC and the IN-scoped token fails with "unable to refresh
          # access token" — which is exactly what silently broke deploys on
          # 2026-07-19.
          set +e
          DEPLOY_OUTPUT=$(catalyst deploy --only appsail,client --ignore-scripts \
            --dc in -p "$CATALYST_PROJECT_ID" --org "$CATALYST_ORG_ID" \
            --token "$CATALYST_CLI_TOKEN" 2>&1)
          DEPLOY_EXIT=$?
          set -e
          echo "$DEPLOY_OUTPUT"
          if [ $DEPLOY_EXIT -ne 0 ] || echo "$DEPLOY_OUTPUT" | grep -qiE "cannot be empty|error|failed to deploy"; then
            echo "::error::catalyst deploy failed or printed an error (exit=$DEPLOY_EXIT) — aborting before the smoke test can mask this as success."
            exit 1
          fi

      - name: Wait for AppSail to come up
        run: sleep 45

      - name: Smoke test live deployment
        id: smoke
        continue-on-error: true
        run: python3 scripts/smoke_test.py --base "$BACKEND_URL"

      - name: Tag last-good-deploy on success
        if: steps.smoke.outcome == 'success'
        # Non-fatal: the deploy already succeeded and smoke passed. A tag-push
        # hiccup (e.g. transient perms) must not mark a healthy deploy as failed.
        continue-on-error: true
        run: |
          git tag -f last-good-deploy
          git push -f origin last-good-deploy

      - name: Auto-revert to last-good-deploy on failure
        if: steps.smoke.outcome == 'failure'
        env:
          CATALYST_CLI_TOKEN: ${{ secrets.CATALYST_CLI_TOKEN }}
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
          CATALYST_ORG_ID: ${{ secrets.CATALYST_ORG_ID }}
        run: |
          echo "::error::Smoke test failed — rolling back to last-good-deploy."
          if git rev-parse last-good-deploy >/dev/null 2>&1; then
            git checkout last-good-deploy -- backend/ frontend/ client-package/ scripts/ requirements.txt .env 2>/dev/null || true
            cd frontend && npm ci && VITE_API_BASE_URL="$BACKEND_URL" npm run build && cd ..
            find client-package -mindepth 1 ! -name 'client-package.json' -delete
            cp -r frontend/dist/. client-package/
            python3 scripts/gen_app_config.py
            python3 -m pip install -r backend/requirements.txt -t backend/ --upgrade --quiet
            catalyst deploy --only appsail,client --ignore-scripts \
              --dc in -p "$CATALYST_PROJECT_ID" --org "$CATALYST_ORG_ID" \
              --token "$CATALYST_CLI_TOKEN"
            echo "Rolled back successfully."
          else
            echo "::warning::No last-good-deploy tag yet — cannot auto-revert."
          fi

      - name: Fail run if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
