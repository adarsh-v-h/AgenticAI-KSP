[pytest]
# Backend property and unit tests live under backend/tests.
testpaths = backend/tests
python_files = test_*.py *_test.py *_property_test.py
python_classes = Test*
python_functions = test_*
# test_integration.py is a standalone script (run directly with a live backend,
# DB, and Catalyst token — see its module docstring). Its functions take
# fixture-style args (doc_ids) and use bare `async def`, so pytest cannot and
# should not collect them. Exclude it from automated collection.
addopts = -ra --ignore=backend/tests/test_integration.py
